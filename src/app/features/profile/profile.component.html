<div class="profile-page" *ngIf="!loading; else loader">
  <h2>Profile Settings</h2>

  <div class="card">
    <h3>Personal Information</h3>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="row">
        <div class="field"><label>First Name</label><input formControlName="firstName"></div>
        <div class="field"><label>Last Name</label><input formControlName="lastName"></div>
      </div>
      <div class="field"><label>Email</label><input formControlName="email"></div>
      <button class="btn-primary" [disabled]="saving">{{saving? 'Saving...' : 'Save Changes'}}</button>
    </form>
  </div>

  <div class="card">
    <h3>Change Password</h3>
    <form [formGroup]="passwordForm" (ngSubmit)="updatePassword()">
      <div class="field"><label>Current Password</label><input [type]="showPass?'text':'password'" formControlName="currentPassword"></div>
      <div class="field"><label>New Password</label><input [type]="showPass?'text':'password'" formControlName="newPassword"></div>
      <div class="field"><label>Confirm New Password</label><input [type]="showPass?'text':'password'" formControlName="confirmNewPassword"></div>
      <label class="check"><input type="checkbox" (change)="showPass=!showPass"> Show passwords</label>
      <button class="btn-primary" type="submit">Update Password</button>
    </form>
  </div>
</div>

<ng-template #loader><p>Loading profile...</p></ng-template>
